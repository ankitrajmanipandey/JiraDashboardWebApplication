<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            font-weight: 300;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            font-size: 1.2em;
            color: #666;
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #ff3742;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .tiles-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .tile {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--tile-color);
        }

        .tile:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tile-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
        }

        .tile-count {
            background: var(--tile-color);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            min-width: 50px;
            text-align: center;
        }

        .tile-description {
            color: #666;
            font-size: 1em;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .tile-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .view-details {
            color: var(--tile-color);
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .view-details:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header h1 {
                font-size: 2em;
            }

            .tiles-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .tile {
                padding: 20px;
            }
        }

        .arrow-icon {
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .tile:hover .arrow-icon {
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Jira Dashboard</h1>
        <div class="user-info">
            <span class="username">Welcome, {{ username }}!</span>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>
    </div>

    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <div class="tiles-container">
        {% for query_key, tile in tile_data.items() %}
            <a href="{{ url_for('tile_details', query_key=query_key) }}" class="tile" style="--tile-color: {{ tile.color }}">
                <div class="tile-header">
                    <h3 class="tile-title">{{ tile.title }}</h3>
                </div>
                <p class="tile-description">{{ tile.description }}</p>
                <div class="tile-footer">
                    <span class="view-details">
                        View Details <span class="arrow-icon">→</span>
                    </span>
                </div>
            </a>
        {% endfor %}
    </div>

    {% if not tile_data %}
        <div class="loading">
            <p>Loading dashboard tiles...</p>
        </div>
    {% endif %}

</body>
</html>
